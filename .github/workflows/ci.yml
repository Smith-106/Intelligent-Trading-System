name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build package
        run: python -m build

      - name: Ruff format check
        run: python -m ruff format --check quantflow tests scripts

      - name: Ruff lint
        run: python -m ruff check quantflow tests scripts

      - name: Mypy
        run: python -m mypy quantflow tests

      - name: CLI smoke test
        run: python -m quantflow.cli.main status

      - name: Pytest with coverage
        run: python -m pytest tests --cov=quantflow --cov-report=term-missing
