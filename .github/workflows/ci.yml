name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Least-privilege: this job only needs to read code and post check runs.
    # An explicit permissions block guarantees this regardless of repo/org defaults.
    permissions:
      contents: read

    steps:
      - name: Checkout
        # ISS-009 (SEC-005): SHA-pinned actions prevent a supply-chain
        # compromise of the action's repo from silently changing what runs
        # in CI. The sha@vN form resolves the tag to a fixed commit.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e2fea747208f53575f101c1b292418e6f # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build package
        run: python -m build

      - name: Ruff format check
        run: python -m ruff format --check quantflow tests scripts

      - name: Ruff lint
        run: python -m ruff check quantflow tests scripts

      - name: Mypy
        run: python -m mypy quantflow tests

      - name: Dependency vulnerability audit (pip-audit)
        # Fails CI on known CVEs in pinned dependencies (SEC-003).
        run: python -m pip_audit --requirement requirements-lock.txt --strict

      - name: CLI smoke test
        run: python -m quantflow.cli.main status

      - name: Pytest with coverage
        run: python -m pytest tests --cov=quantflow --cov-report=term-missing
