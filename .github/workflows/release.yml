name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  # ISS-009 (SEC-005): least-privilege — release only needs to write release
  # assets; no broader repo write or admin scope.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # ISS-009 (SEC-005): SHA-pinned actions (see ci.yml rationale).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Setup Python
        uses: actions/setup-python@0b93645e2fea747208f53575f101c1b292418e6f # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify quality gates
        run: |
          python -m ruff format --check quantflow tests scripts
          python -m ruff check quantflow tests scripts
          python -m mypy quantflow tests
          python -m pytest tests --cov=quantflow --cov-report=term-missing -q

      - name: Build release artifacts
        run: python scripts/build_release.py --tag "${{ env.RELEASE_TAG }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac09ea0886f96269626b20bc4f1fd # v4
        with:
          name: quantflow-${{ env.RELEASE_TAG }}-artifacts
          path: |
            dist/quantflow-${{ env.RELEASE_VERSION }}.tar.gz
            dist/quantflow-${{ env.RELEASE_VERSION }}-py3-none-any.whl
            dist/quantflow-${{ env.RELEASE_VERSION }}.tar.gz.sha256
            dist/quantflow-${{ env.RELEASE_VERSION }}-py3-none-any.whl.sha256
            dist/SHA256SUMS.txt
            dist/release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES_FILE="docs/release/${RELEASE_TAG}/release-notes.md"
          TAR_FILE="dist/quantflow-${RELEASE_VERSION}.tar.gz"
          WHL_FILE="dist/quantflow-${RELEASE_VERSION}-py3-none-any.whl"
          TAR_SUM="${TAR_FILE}.sha256"
          WHL_SUM="${WHL_FILE}.sha256"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${TAR_FILE}" \
              "${WHL_FILE}" \
              "${TAR_SUM}" \
              "${WHL_SUM}" \
              dist/SHA256SUMS.txt \
              dist/release-manifest.json \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${TAR_FILE}" \
              "${WHL_FILE}" \
              "${TAR_SUM}" \
              "${WHL_SUM}" \
              dist/SHA256SUMS.txt \
              dist/release-manifest.json \
              --notes-file "${NOTES_FILE}" \
              --title "QuantFlow ${RELEASE_TAG}"
          fi
