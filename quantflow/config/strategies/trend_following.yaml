metadata:
  title: "Trend Following"
  description: "MA crossover, MACD, RSI, ATR, volume multi-filter trend strategy"

param_space:
  fast_ma_period: [3, 15]
  slow_ma_period: [30, 120]
  rsi_oversold: [20, 40]
  rsi_overbought: [60, 85]
  atr_multiplier: [1.2, 3.0]
  volume_threshold: [0.8, 2.0]

# Trend Following Strategy Configuration
strategy:
  name: "trend_following"
  symbol: "BTC/USDT"
  timeframe: "1d"

  params:
    ma_fast: 5
    ma_medium: 20
    ma_slow: 60
    rsi_period: 14
    rsi_buy_min: 40
    rsi_buy_max: 70
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    atr_min_volatility: 0.02
    volume_ma_period: 20

  exit:
    stop_loss_pct: -0.05
    stop_loss_atr_multiplier: 2.0
    take_profit_pct: 0.15
    trailing_stop_atr_multiplier: 1.5