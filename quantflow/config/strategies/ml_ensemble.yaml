metadata:
  title: "ML Ensemble"
  description: "Model-driven ensemble signals with configurable thresholds"

param_space:
  entry_threshold: [0.5, 0.8]
  exit_threshold: [0.2, 0.5]

strategy:
  name: "ml_ensemble"
  symbol: "BTC/USDT"
  timeframe: "4h"
  params:
    entry_threshold: 0.6
    exit_threshold: 0.4
    lookback: 252
    retrain_interval: 10080
    model_path: "models/ml_ensemble.joblib"
  exit:
    stop_loss_pct: -0.03
    take_profit_pct: 0.08
