metadata:
  title: "Mean Reversion"
  description: "RSI plus Bollinger Band mean reversion with volume confirmation"

param_space:
  rsi_oversold: [20, 40]
  rsi_overbought: [60, 85]
  bb_std: [1.5, 3.0]
  exit_rsi_overbought: [50, 75]
  exit_rsi_oversold: [25, 50]

# Mean Reversion Strategy Configuration
strategy:
  name: "mean_reversion"
  symbol: "BTC/USDT"
  timeframe: "4h"

  params:
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    bollinger_period: 20
    bollinger_std: 2.0
    volume_ma_period: 20
    volume_threshold: 1.2
    stop_loss_pct: 0.03

  exit:
    stop_loss_pct: -0.03
    take_profit_pct: 0.05
    trailing_stop_pct: 0.02
