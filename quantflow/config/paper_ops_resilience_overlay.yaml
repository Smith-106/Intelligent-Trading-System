# Paper ops resilience overlay (T029) — OPTIONAL, default-off semantics.
#
# Does NOT replace default.yaml. default.yaml keeps:
#   state.enabled: false
#   reconciliation.enabled: false
#
# Enable only after:
#   1) python scripts/resilience_drill.py   # must overall=pass
#   2) MonitoringSink / alert path reviewed (drift → critical)
#   3) Operator accepts fail-closed restore (corrupt checkpoint refuses trade)
#
# Example (Path A paper, with Baseline-0 cost/RP overlay first if needed):
#   quantflow run --mode paper --strategy trend_following \
#     --symbols BTC/USDT,ETH/USDT,SOL/USDT --timeframe 1h --interval 60 \
#     --config quantflow/config/paper_baseline0_overlay.yaml \
#     --config quantflow/config/paper_ops_resilience_overlay.yaml
#
# If CLI only accepts one --config, merge this block into a local operator
# overlay (do not commit secrets; do not force-enable in default.yaml).
#
# Acceptance: paper only — never use this overlay as live authorization.

# T-s1-03: checkpoint restore (paper/live session L4 snapshot)
state:
  enabled: true
  checkpoint_dir: "./data/checkpoints"
  checkpoint_interval_minutes: 5

# T-s1-01: periodic local vs gateway book reconciliation
reconciliation:
  enabled: true
  interval_minutes: 5
  drift_threshold_bps: 100
  order_staleness_seconds: 300
