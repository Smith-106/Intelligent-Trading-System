# QuantFlow 默认配置
# 所有参数均可通过 YAML 覆盖，不需要修改源码

# ==================== 数据层 ====================
data:
  parquet_dir: "./data/parquet"        # K线数据存储目录（Hive分区格式）
  duckdb_path: "./data/quantflow.duckdb" # DuckDB 数据库路径（:memory 为内存模式）
  redis_url: "redis://localhost:6379"   # Redis 连接地址（实时行情缓存）
  exchange: "okx"                       # 交易所（目前仅支持 okx）
  sandbox: false                        # 是否使用 OKX sandbox（测试网）
  rate_limit: 10                        # API 请求频率限制（次/秒）

# ==================== 指标层 ====================
indicators:
  rsi_period: 14                        # RSI 周期
  macd_fast: 12                         # MACD 快线周期
  macd_slow: 26                         # MACD 慢线周期
  macd_signal: 9                        # MACD 信号线周期
  atr_period: 14                        # ATR 周期
  bollinger_period: 20                  # 布林带周期
  bollinger_std: 2.0                    # 布林带标准差倍数

# ==================== 策略层 ====================
strategy:
  research_engine: "eventdriven"       # 研究引擎：eventdriven（BacktestEngine，纯 pandas/numpy 向量化，vectorbt 已移除）。注：该字段当前零消费方（schema-drift 装饰性，见 specs/learnings YAML-schema-drift 模式），保留供未来 engine dispatch。drift-realign DFT-2c8d4f1e 修正 2026-07-26。
  validation:
    cpcv_groups: 8                      # CPCV 分组数（8组×2测试=28路径）
    cpcv_test_groups: 2                 # CPCV 测试组数
    embargo_periods: 5                  # 禁入期（消除信息泄漏的K线数）
    dsr_threshold: 0.95                 # DSR 通过阈值（>0.95 表示策略非过拟合）
    pbo_threshold: 0.5                  # PBO 通过阈值（<0.5 表示过拟合概率低于50%）
    wfo_oos_efficiency: 0.5             # WFO OOS效率阈值（>50% 表示样本外有效）

# ==================== 风控层 ====================
risk:
  position_limit_pct: 0.20             # 单标的最大仓位占比（20%）
  max_positions: 5                      # 组合最大持仓数量
  daily_loss_limit: -0.03              # 日度最大亏损限制（-3%触发暂停）
  weekly_loss_limit: -0.05             # 周度最大亏损限制（-5%触发暂停）
  max_drawdown: -0.10                   # 组合最大回撤（-10%触发熔断）
  kill_switch_enabled: true             # 是否启用 Kill Switch（一键清仓）
  kelly_fraction: 0.5                   # 半 Kelly 仓位比例
  var_confidence: 0.95                  # VaR 置信度
  fixed_pct: 0.10                       # fixed-method 仓位比例（原 PositionSizer 硬编码，ISS-012 config-source）
  min_order_notional: 10.0              # PositionSizer 最小下单名义价值阈值（原硬编码，ISS-012 config-source）
  # T-s1-04: 单所总敞口上限（持仓名义 + pending 占净值的比例；超限拒新开仓，
  # 放行退出信号以便降敞）。注释掉 = 不设限。
  exchange_exposure_limit_pct: 0.8
  # T-s1-04: 交易所健康度监控 + 熔断。enabled 默认 false，既有运行零行为变化；
  # 开启后 OKX REST 错误/50011/WS 断连喂给 ExchangeHealthMonitor，滑动窗口
  # 错误率 > 阈值或连续限频 ≥ streak 触发熔断（RiskEngine.check 全拒），
  # cooldown 后连续 3 次 success 滞回恢复。
  exchange_health:
    enabled: false                      # 是否启用交易所熔断（默认关闭）
    error_rate_threshold: 0.5           # 滑动窗口错误率阈值
    window_seconds: 60                  # 滑动窗口长度（秒）
    rate_limit_streak: 3                # 连续 50011 限频触发阈值
    cooldown_seconds: 300               # 熔断冷却时间（秒）
  # s4 (T-s4-01): 波动率自适应策略预算。enabled 默认 false，静态预算零行为变化；
  # 开启后按近期收益 EWMA 波动率缩放各策略预算（波动升高预算缩减，fail-closed），
  # 缩放因子 clamp 到 [min_scale, max_scale]，收益样本不足时回退静态预算。
  dynamic_budget:
    enabled: false                      # 是否启用动态预算（默认关闭）
    vol_ewma_span: 30                   # 波动率 EWMA 窗口（bar 数）
    target_vol_pct: 0.15                # 年化目标波动率（15%）
    vol_annualization: 365              # 年化因子（7x24 市场）
    min_scale: 0.5                      # 缩放下限（预算最多缩半）
    max_scale: 1.5                      # 缩放上限（预算最多放大 1.5 倍）
    min_samples: 30                     # 波动率估计最少样本数
    var_scaling: false                  # s5：组合 CVaR 恶化时额外缩放预算（默认关闭）
  # Highflyer-style hierarchical book budget (default OFF). Enable for product
  # paths that use beta/overlay sleeves + DD kill on risk-increasing entries.
  book_risk_budget:
    enabled: false
    book_gross_limit: 1.2
    book_net_limit: 1.2
    kill_drawdown: 0.15
    beta_sleeve: 1.0
    overlay_sleeve: 0.20
  # s5 (T-s5-02): 组合级风险平价分配。enabled 默认 false，静态 allocation 零行为变化；
  # 开启后引擎跟踪每策略收益，每 rebalance_every_n_bars 根 bar 用 RiskParityOptimizer
  # 重算风险平价权重并推入 PortfolioManager.set_allocation（优化失败降级等权）。
  portfolio_optimization:
    enabled: false                      # 是否启用组合优化（默认关闭）
    method: risk_parity                 # 分配方法（risk_parity | mean_variance）
    vol_window: 30                      # 每策略波动率估计窗口（bar 数）
    min_samples: 30                     # 每策略最少样本数（不足则降级等权）
    rebalance_every_n_bars: 48          # 再平衡周期（1h bar 约每 2 天）
    fallback: equal                     # 降级策略（equal/static）
  # T016: paper→live 最短样本/天数（默认开启；不满足 → rejected，原因可读）
  paper_readiness:
    enabled: true                       # 是否启用 paper 最短门槛
    min_paper_days: 7.0                 # 最短 paper 日历天数
    min_fills: 20                       # 最短成交笔数
    min_orders: 0                       # 0 = 不单独约束订单数
    require_evidence: true              # promote 时必须提供 paper_evidence

# ==================== 执行层 ====================
execution:
  mode: "paper"                         # 运行模式：paper / sandbox / live
  order_timeout: 30                     # 订单超时秒数（超时自动撤单）
  reconnect_interval: 5                 # 断线重连间隔秒数
  reconnect_attempts: 5                 # 最大重连尝试次数
  slippage: 0.001                       # 模拟滑点 (0.1%)
  maker_fee: 0.0008                     # Maker 手续费率 (0.08%)
  taker_fee: 0.001                      # Taker 手续费率 (0.1%)
  market_type: "spot"                   # ISS-005: OKX 账户/市场范围 (spot: 现货,从 fetch_balance 推导持仓; swap: 合约,读 contracts)

# ==================== 监控层 ====================
monitoring:
  prometheus_port: 8000                 # Prometheus 指标端口（容器内端口）
  grafana_port: 3000                    # Grafana 仪表板端口
  alert_channels: []                    # 告警渠道配置（见下方示例）

# ==================== 对账层 ====================
# T-s1-01: ReconciliationEngine 生产化配置。enabled 默认 false，
# 既有运行零行为变化；TradingSession 接线读取本段（见 common/config.py
# ReconciliationConfig）。
reconciliation:
  enabled: false                        # 是否启用周期对账（默认关闭）
  interval_minutes: 5                   # 对账执行间隔（分钟）
  drift_threshold_bps: 100              # 持仓漂移告警阈值（基点，100=1%）
  order_staleness_seconds: 300          # 孤儿订单滞留判定阈值（秒）

# T-s1-03: 会话 checkpoint 状态恢复配置。enabled 默认 false，
# 既有运行零行为变化；开启后 paper/live 会话周期保存 L4 状态快照，
# 重启时恢复并经对账校验，校验通过前拒绝新开仓信号（fail-closed）。
state:
  enabled: false                        # 是否启用 checkpoint 恢复（默认关闭）
  checkpoint_dir: "./data/checkpoints"  # checkpoint 存放目录
  checkpoint_interval_minutes: 5        # checkpoint 保存间隔（分钟）

# ==================== AI 层 ====================
# s3-ai-research-pipeline (wave2): RD-Agent 因子挖掘 + 模型注册。
# enabled 默认 false，既有运行零行为变化。API key 只从环境变量读取
# （OPENAI_API_KEY / LITELLM_API_KEY / CHAT_MODEL），不写入配置/日志。
ai:
  rdagent:
    enabled: false                      # 是否启用 RD-Agent 真实因子挖掘（默认关闭）
    llm_backend: "litellm"              # LLM 后端：litellm（OpenAI 兼容）
    chat_model: ""                      # 对话模型（如 gpt-4o；留空则用环境 CHAT_MODEL）
    llm_api_base: ""                    # LLM API 端点（留空则用环境 OPENAI_API_BASE）
    llm_timeout_seconds: 300            # LLM 调用超时（秒）
    cli_timeout_seconds: 600            # rdagent CLI 进程超时（秒）
  model_registry_enabled: false         # 是否启用模型注册（默认关闭）
  registry_dir: "./data/models"        # 模型注册目录
  # s4 (T-s4-02): 自动回测闭环（训练 → 验证 → 注册/淘汰 + 决策日志）。
  # enabled 默认 false；开启后由 AutoResearchLoop 编排一轮完整迭代。
  auto_loop:
    enabled: false                      # 是否启用自动回测闭环（默认关闭）
    log_path: "./data/ai_loop/decisions.jsonl"  # 决策日志（JSONL 追加）

# ==================== KOL 参考权重（顾问，默认关闭）====================
# Discord 共识只缩放仓位，不单独开仓/反向。需先有 data/kol_signals/latest_consensus.json
kol_reference:
  enabled: false
  max_boost: 0.15                       # 与系统同向时最多 +15% 名义
  max_cut: 0.25                         # 与系统反向时最多 -25% 名义
  min_abs_score: 0.35
  require_actionable: true
  max_age_hours: 6.0
  consensus_path: "data/kol_signals/latest_consensus.json"

