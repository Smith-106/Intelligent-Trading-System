[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantflow"
version = "0.1.1"
description = "Personal quantitative trading system for Crypto (OKX)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "QuantFlow Dev" }]
keywords = ["quantitative-trading", "crypto", "backtesting", "okx"]

dependencies = [
    "ccxt>=4.0",
    # "vectorbt>=0.26",  # requires numba, incompatible with Python 3.14+
    "optuna>=3.6",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "scikit-learn>=1.5",
    "structlog>=24.0",
    "feedparser>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
talib = ["TA-Lib>=0.4"]
purgedcv = ["purgedcv>=0.0.10"]
ml = ["qlib>=0.9", "torch>=2.0", "transformers>=4.30"]
all = ["quantflow[talib,purgedcv,ml]"]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.0",
    "jupyter>=1.0",
]

[project.scripts]
quantflow = "quantflow.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["quantflow"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B027", "N806", "SIM102", "SIM116", "SIM117", "RUF001", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["quantflow"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "duckdb.*",
    "feedparser",
    "joblib",
    "optuna.*",
    "pandas",
    "scipy",
    "scipy.*",
    "sklearn.*",
    "torch",
    "transformers",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = [
    "assignment",
    "attr-defined",
    "call-arg",
    "misc",
    "no-untyped-call",
    "no-untyped-def",
    "union-attr",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "live: marks tests requiring live API connection",
]

[tool.coverage.run]
source = ["quantflow"]
omit = ["tests/*", "quantflow/cli/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
